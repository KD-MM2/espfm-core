<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESPFanManager v2</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e0e0e0;--dim:#888;--accent:#4fc3f7;--green:#66bb6a;--red:#ef5350;--yellow:#ffa726;--blue:#42a5f5}
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px;max-width:960px;margin:0 auto}
h2{font-size:15px;font-weight:600;margin-bottom:8px}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
.header h1{font-size:18px;color:var(--accent)}
.header .info{font-size:11px;color:var(--dim);text-align:right}
.header .info span{display:inline-block;margin-left:12px}
.tabs{display:flex;gap:2px;margin-bottom:10px}
.tab{padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:6px 6px 0 0;cursor:pointer;color:var(--dim);font-size:12px;font-weight:600;transition:.15s}
.tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
.tab:hover:not(.active){color:var(--text)}
.panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:0 8px 8px 8px;padding:14px}
.panel.active{display:block}
.form-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.form-row input,.form-row select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:4px;font-size:12px;min-width:80px}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--accent)}
.form-row label{font-size:11px;color:var(--dim);display:block;margin-bottom:2px}
.btn{padding:6px 14px;border-radius:4px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{opacity:.85}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{opacity:.85}
.btn-green{background:var(--green);color:#000}.btn-green:hover{opacity:.85}
.btn-ghost{padding:4px 10px;font-size:11px;background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-ok{background:#1b3a1b;color:var(--green)}.badge-warn{background:#3a2e1b;color:var(--yellow)}.badge-err{background:#3a1b1b;color:var(--red)}.badge-info{background:#1b2e3a;color:var(--accent)}
.duty-bar{display:inline-block;height:6px;border-radius:3px;background:var(--blue);vertical-align:middle;margin-right:6px;min-width:2px}
.inline-edit{display:flex;gap:4px;align-items:center}
.inline-edit input{width:50px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:2px 6px;border-radius:3px;font-size:11px}
.inline-edit select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:2px;font-size:10px;border-radius:3px}
.inline-edit input:focus,.inline-edit select:focus{outline:none;border-color:var(--accent)}
.points-editor{margin:8px 0}
.point-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.point-row input{width:70px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:12px}
.msg{font-size:12px;padding:6px 10px;border-radius:4px;margin:6px 0}
.msg-ok{background:#1b3a1b;color:var(--green)}.msg-err{background:#3a1b1b;color:var(--red)}
.scan-grid{display:grid;grid-template-columns:1fr 80px 60px;gap:6px;align-items:center;margin:8px 0}
.scan-hdr{font-size:11px;color:var(--dim);font-weight:600}
.scan-row{cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--border);border-radius:4px;transition:.15s}
.scan-row:hover{background:var(--border)}
.scan-row .rssi{color:var(--green);font-weight:600}
.sched-inline{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sched-inline input{width:48px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:2px 4px;border-radius:3px;font-size:11px}
</style>
</head>
<body>

<div class="header">
  <h1>ESPFanManager</h1>
  <div class="info" id="sysinfo">Loading...</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="fans">Fans</div>
  <div class="tab" data-tab="sources">Sources</div>
  <div class="tab" data-tab="curves">Curves</div>
  <div class="tab" data-tab="schedules">Schedules</div>
  <div class="tab" data-tab="wifi">WiFi</div>
</div>

<!-- FANS -->
<div class="panel active" id="panel-fans">
  <h2>Create Fan</h2>
  <div class="form-row">
    <div><label>PWM GPIO</label><input id="fan-pwm" type="number" min="0" max="48" value="10"></div>
    <div><label>Tach GPIO</label><input id="fan-tach" type="number" min="0" max="48" placeholder="none"></div>
    <div><label>Name</label><input id="fan-name" placeholder="Fan name" maxlength="15"></div>
    <button class="btn btn-accent" onclick="fanCreate()">+ Create</button>
  </div>
  <div id="fan-msg"></div>
  <h2>Fans</h2>
  <div id="fan-list"></div>
</div>

<!-- SOURCES -->
<div class="panel" id="panel-sources">
  <h2>Create Source</h2>
  <div class="form-row">
    <div><label>Type</label><select id="src-type"><option value="manual">Manual</option><option value="ntc">NTC</option><option value="ds18b20">DS18B20</option></select></div>
    <div><label>GPIO</label><input id="src-gpio" type="number" min="0" max="48" placeholder="auto"></div>
    <div><label>Name</label><input id="src-name" placeholder="Name" maxlength="15"></div>
    <button class="btn btn-accent" onclick="srcCreate()">+ Create</button>
  </div>
  <div id="src-msg"></div>
  <h2>Sources</h2>
  <div id="src-list"></div>
</div>

<!-- CURVES -->
<div class="panel" id="panel-curves">
  <h2>Create Curve</h2>
  <div class="form-row">
    <div><label>Name</label><input id="cur-name" placeholder="Curve name" maxlength="15"></div>
    <button class="btn btn-accent" onclick="curCreate()">+ Create</button>
  </div>
  <div class="points-editor" id="cur-editor">
    <div class="point-row"><input type="number" placeholder="Temp C" value="20"><input type="number" placeholder="Duty %" value="30" min="0" max="100"><button class="btn btn-ghost" onclick="addPoint()">+</button></div>
    <div class="point-row"><input type="number" placeholder="Temp C" value="40"><input type="number" placeholder="Duty %" value="60" min="0" max="100"><button class="btn btn-ghost" onclick="this.parentElement.remove()">-</button></div>
    <div class="point-row"><input type="number" placeholder="Temp C" value="60"><input type="number" placeholder="Duty %" value="100" min="0" max="100"><button class="btn btn-ghost" onclick="this.parentElement.remove()">-</button></div>
  </div>
  <div id="cur-msg"></div>
  <h2>Curves</h2>
  <div id="cur-list"></div>
</div>

<!-- SCHEDULES -->
<div class="panel" id="panel-schedules">
  <h2>Create Schedule</h2>
  <div class="form-row">
    <div><label>Fan ID</label><input id="sched-fan" type="number" min="0" value="0"></div>
    <div><label>Duty %</label><input id="sched-duty" type="number" min="0" max="100" value="50"></div>
    <div><label>Start</label><input id="sched-start" type="number" min="0" max="1439" value="480"></div>
    <div><label>End</label><input id="sched-end" type="number" min="0" max="1439" value="1080"></div>
    <button class="btn btn-accent" onclick="schedCreate()">+ Create</button>
  </div>
  <div id="sched-msg"></div>
  <h2>Schedules</h2>
  <div id="sched-list"></div>
</div>

<!-- WIFI -->
<div class="panel" id="panel-wifi">
  <div style="display:flex;gap:14px;flex-wrap:wrap">
    <div style="flex:1;min-width:280px">
      <h2>Status</h2>
      <div id="wifi-status">Loading...</div>
    </div>
    <div style="flex:1;min-width:280px">
      <h2>Scan</h2>
      <button class="btn btn-accent" onclick="wifiScan()" id="scan-btn">Scan</button>
      <div id="scan-list"></div>
    </div>
  </div>
</div>

<script>
const API='/api/v1';
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

async function api(url,opts){
  const r=await fetch(API+url,{headers:{'Content-Type':'application/json'}});
  return r.json()
}
function $(id){return document.getElementById(id)}
function msg(id,txt,ok){const m=$(id);m.className='msg '+(ok?'msg-ok':'msg-err');m.textContent=txt;setTimeout(function(){m.textContent=''},3000)}
function min2str(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}

/* Tabs */
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});
  document.querySelectorAll('.panel').forEach(function(x){x.classList.remove('active')});
  t.classList.add('active');$('panel-'+t.dataset.tab).classList.add('active')
}});

/* System info */
async function sysPoll(){
  try{var r=await api('/system/info');
    if(r.status!=='ok')return;var d=r.data;
    var u=d.uptime_s>3600?Math.floor(d.uptime_s/3600)+'h '+Math.floor(d.uptime_s%3600/60)+'m':Math.floor(d.uptime_s/60)+'m '+d.uptime_s%60+'s';
    $('sysinfo').innerHTML='<span>v'+d.version+'</span><span>Up '+u+'</span><span>RAM '+(d.heap_free/1024).toFixed(0)+'kB</span><span>Fans '+d.fan_count+'</span><span>Src '+d.source_count+'</span><span>Cur '+d.curve_count+'</span><span>Sched '+d.schedule_count+'</span>'
  }catch(e){}
}
setInterval(sysPoll,3000);sysPoll();

/* ====== FANS ====== */
async function fanRefresh(){
  var r=await api('/fans');if(r.status!=='ok')return;
  if(!r.data.length){$('fan-list').innerHTML='<p style="color:var(--dim)">No fans yet.</p>';return}
  var ml=function(m){return m===1?'AUTO':'MANUAL'};
  var ab=function(a){return a==='stall'?'<span class="badge badge-err">STALL</span>':a==='overtemp'?'<span class="badge badge-warn">HOT</span>':'<span class="badge badge-ok">OK</span>'};
  var h='<table><thead><tr><th>ID</th><th>Name</th><th>Mode</th><th>Duty</th><th>RPM</th><th>Inv</th><th>Alarm</th><th>PWM</th><th>Tach</th><th>Src</th><th>Cur</th><th>Sch</th><th>Grp</th><th></th></tr></thead><tbody>';
  for(var i=0;i<r.data.length;i++){var f=r.data[i];
    h+='<tr><td>'+f.id+'</td><td><b>'+esc(f.name)+'</b></td>'
      +'<td><span class="badge '+(f.mode===1?'badge-info':'badge-ok')+'">'+ml(f.mode)+'</span></td>'
      +'<td><span class="duty-bar" style="width:'+Math.max(f.duty*0.8,2)+'px;background:'+(f.duty>80?'var(--red)':f.duty>40?'var(--yellow)':'var(--green)')+'"></span>'+f.duty+'%</td>'
      +'<td>'+(f.rpm||'-')+'</td>'
      +'<td><input type="checkbox" '+(f.inverted?'checked':'')+' onchange="fanUp('+f.id+',{inverted:this.checked})" style="accent-color:var(--accent)"></td>'
      +'<td>'+ab(f.alarm)+'</td>'
      +'<td>GPIO'+f.pwm_gpio+'</td><td>'+(f.tach_gpio!==255?'GPIO'+f.tach_gpio:'-')+'</td>'
      +'<td>'+(f.source_id!==255?f.source_id:'-')+'</td><td>'+(f.curve_id!==255?f.curve_id:'-')+'</td><td>'+(f.schedule_id!==255?f.schedule_id:'-')+'</td><td>'+(f.group_id||'-')+'</td>'
      +'<td nowrap><div class="inline-edit">'
      +'<select onchange="fanUp('+f.id+',{mode:+this.value});this.value=\'\'"><option value="">mode</option><option value="0">Man</option><option value="1">Auto</option></select>'
      +'<input type="number" placeholder="duty" min="0" max="100" onchange="fanUp('+f.id+',{duty:+this.value});this.value=\'\'">'
      +'<input type="number" placeholder="src" min="0" onchange="fanUp('+f.id+',{source_id:+this.value});this.value=\'\'">'
      +'<input type="number" placeholder="cur" min="0" onchange="fanUp('+f.id+',{curve_id:+this.value});this.value=\'\'">'
      +'<input type="number" placeholder="sch" min="0" onchange="fanUp('+f.id+',{schedule_id:+this.value});this.value=\'\'">'
      +'<input type="number" placeholder="grp" min="0" onchange="fanUp('+f.id+',{group_id:+this.value});this.value=\'\'">'
      +'<button class="btn btn-red" style="padding:2px 8px;font-size:10px" onclick="fanDel('+f.id+')">X</button>'
      +'</div></td></tr>'
  }
  $('fan-list').innerHTML=h+'</tbody></table>'
}
async function fanCreate(){
  var p=+$('fan-pwm').value,n=$('fan-name').value.trim(),t=+$('fan-tach').value;
  if(isNaN(p)||!n)return msg('fan-msg','GPIO and name required',0);
  var b={pwm_gpio:p,name:n};if(!isNaN(t))b.tach_gpio=t;
  var r=await api('/fans',{method:'PUT',body:JSON.stringify(b)});
  r.status==='ok'?($('fan-name').value='',msg('fan-msg','Created',1),fanRefresh()):msg('fan-msg',r.error.message,0)
}
async function fanUp(id,f){var r=await api('/fans/'+id,{method:'PUT',body:JSON.stringify(f)});r.status==='ok'?fanRefresh():alert(r.error.message)}
async function fanDel(id){if(!confirm('Delete fan '+id+'?'))return;var r=await api('/fans/'+id,{method:'DELETE'});r.status==='ok'?fanRefresh():alert(r.error.message)}

/* ====== SOURCES ====== */
async function srcRefresh(){
  var r=await api('/sources');if(r.status!=='ok')return;
  if(!r.data.length){$('src-list').innerHTML='<p style="color:var(--dim)">No sources yet.</p>';return}
  var tl=function(t){return t==='ntc'?'NTC':t==='ds18b20'?'DS18':'Manual'};
  var sb=function(s){return s==='valid'?'<span class="badge badge-ok">OK</span>':s==='stale'?'<span class="badge badge-warn">stale</span>':'<span class="badge badge-err">err</span>'};
  var h='<table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th><th>Temp</th><th>GPIO</th><th>Set</th><th></th></tr></thead><tbody>';
  for(var i=0;i<r.data.length;i++){var s=r.data[i];
    h+='<tr><td>'+s.id+'</td><td><b>'+esc(s.name)+'</b></td><td>'+tl(s.type)+'</td><td>'+sb(s.status)+'</td>'
      +'<td style="font-size:16px;font-weight:700">'+s.temp_c.toFixed(1)+' C</td><td>'+(s.gpio!==255?s.gpio:'-')+'</td>'
      +'<td>'+(s.type==='manual'?'<input type="number" step="0.5" placeholder="C" onchange="srcSet('+s.id+',+this.value);this.value=\'\'" style="width:60px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:11px">':'-')+'</td>'
      +'<td><button class="btn btn-red" style="padding:2px 8px;font-size:10px" onclick="srcDel('+s.id+')">X</button></td></tr>'
  }
  $('src-list').innerHTML=h+'</tbody></table>'
}
async function srcCreate(){
  var t=$('src-type').value,n=$('src-name').value.trim(),g=+$('src-gpio').value;
  if(!n)return msg('src-msg','Name required',0);
  var b={type:t,name:n};if(!isNaN(g))b.gpio=g;
  var r=await api('/sources',{method:'PUT',body:JSON.stringify(b)});
  r.status==='ok'?($('src-name').value='',msg('src-msg','Created',1),srcRefresh()):msg('src-msg',r.error.message,0)
}
async function srcSet(id,v){if(isNaN(v))return;var r=await api('/sources/temp',{method:'POST',body:JSON.stringify({id:id,temp_c:v})});r.status==='ok'?srcRefresh():alert(r.error.message)}
async function srcDel(id){if(!confirm('Delete source '+id+'?'))return;var r=await api('/sources/'+id,{method:'DELETE'});r.status==='ok'?srcRefresh():alert(r.error.message)}

/* ====== CURVES ====== */
function getPts(){
  var pts=[];document.querySelectorAll('#cur-editor .point-row').forEach(function(r){
    var i=r.querySelectorAll('input');var t=+i[0].value,d=+i[1].value;if(!isNaN(t)&&!isNaN(d))pts.push({temp_c:t,duty:d})
  });return pts
}
function addPoint(){var d=document.createElement('div');d.className='point-row';d.innerHTML='<input type="number" placeholder="Temp C"><input type="number" placeholder="Duty %" min="0" max="100"><button class="btn btn-ghost" onclick="this.parentElement.remove()">-</button>';$('cur-editor').appendChild(d)}
async function curRefresh(){
  var r=await api('/curves');if(r.status!=='ok')return;
  if(!r.data.length){$('cur-list').innerHTML='<p style="color:var(--dim)">No curves yet.</p>';return}
  var h='<table><thead><tr><th>ID</th><th>Name</th><th>Points</th><th></th></tr></thead><tbody>';
  for(var i=0;i<r.data.length;i++){var c=r.data[i];
    h+='<tr><td>'+c.id+'</td><td><b>'+esc(c.name)+'</b></td><td>'+c.points.map(function(p){return p.temp_c+'C -> '+p.duty+'%'}).join(', ')+'</td>'
      +'<td nowrap><button class="btn btn-ghost cur-edit-btn" data-id="'+c.id+'" data-name="'+esc(c.name)+'" data-points=\''+JSON.stringify(c.points).replace(/'/g,'&#39;')+'\'>Edit</button>'
      +'<button class="btn btn-red" style="padding:2px 8px;font-size:10px" onclick="curDel('+c.id+')">X</button></td></tr>'
  }
  $('cur-list').innerHTML=h+'</tbody></table>'
}
async function curCreate(){
  var n=$('cur-name').value.trim(),pts=getPts();
  if(!n)return msg('cur-msg','Name required',0);if(pts.length<2)return msg('cur-msg','Need 2+ points',0);
  var r=await api('/curves',{method:'PUT',body:JSON.stringify({name:n,points:pts})});
  r.status==='ok'?($('cur-name').value='',msg('cur-msg','Created',1),curRefresh()):msg('cur-msg',r.error.message,0)
}
async function curEdit(id,name,pts){
  var nn=prompt('Name',name);if(!nn)return;
  var ps=prompt('temp:duty,...',pts.map(function(p){return p.temp_c+':'+p.duty}).join(','));
  if(!ps)return;var pa=ps.split(',').map(function(s){var x=s.split(':');return{temp_c:+x[0],duty:+x[1]}});
  var r=await api('/curves/'+id,{method:'PUT',body:JSON.stringify({name:nn,points:pa})});
  r.status==='ok'?curRefresh():alert(r.error.message)
}
async function curDel(id){if(!confirm('Delete curve '+id+'?'))return;var r=await api('/curves/'+id,{method:'DELETE'});r.status==='ok'?curRefresh():alert(r.error.message)}

/* ====== SCHEDULES ====== */
async function schedRefresh(){
  var r=await api('/schedules');if(r.status!=='ok')return;
  if(!r.data.length){$('sched-list').innerHTML='<p style="color:var(--dim)">No schedules yet.</p>';return}
  var h='<table><thead><tr><th>ID</th><th>Fan</th><th>Duty</th><th>Start</th><th>End</th><th>Active</th><th></th></tr></thead><tbody>';
  for(var i=0;i<r.data.length;i++){var s=r.data[i];
    h+='<tr><td>'+s.id+'</td><td>'+s.fan_id+'</td>'
      +'<td><div class="sched-inline"><input type="number" value="'+s.duty+'" min="0" max="100" onchange="schedUp('+s.id+',{duty:+this.value})">%</div></td>'
      +'<td><div class="sched-inline"><input type="number" value="'+s.start_min+'" min="0" max="1439" onchange="schedUp('+s.id+',{start_min:+this.value})"></div></td>'
      +'<td><div class="sched-inline"><input type="number" value="'+s.end_min+'" min="0" max="1439" onchange="schedUp('+s.id+',{end_min:+this.value})"></div></td>'
      +'<td><input type="checkbox" '+(s.enabled?'checked':'')+' onchange="schedUp('+s.id+',{enabled:this.checked})" style="accent-color:var(--accent)"></td>'
      +'<td><button class="btn btn-red" style="padding:2px 8px;font-size:10px" onclick="schedDel('+s.id+')">X</button></td></tr>'
  }
  $('sched-list').innerHTML=h+'</tbody></table>'
}
async function schedCreate(){
  var f=+$('sched-fan').value,d=+$('sched-duty').value,s=+$('sched-start').value,e=+$('sched-end').value;
  if(isNaN(f)||isNaN(d)||isNaN(s)||isNaN(e))return msg('sched-msg','All fields required',0);
  var r=await api('/schedules',{method:'PUT',body:JSON.stringify({fan_id:f,duty:d,start_min:s,end_min:e})});
  r.status==='ok'?(msg('sched-msg','Created',1),schedRefresh()):msg('sched-msg',r.error.message,0)
}
async function schedUp(id,f){var r=await api('/schedules/'+id,{method:'PUT',body:JSON.stringify(f)});r.status==='ok'?schedRefresh():alert(r.error.message)}
async function schedDel(id){if(!confirm('Delete schedule '+id+'?'))return;var r=await api('/schedules/'+id,{method:'DELETE'});r.status==='ok'?schedRefresh():alert(r.error.message)}

/* ====== WIFI ====== */
async function wifiStatus(){
  try{var r=await api('/wifi/status');if(r.status!=='ok')return;var d=r.data;
    $('wifi-status').innerHTML='<p>STA: <span class="badge '+(d.sta_connected?'badge-ok':'badge-err')+'">'+(d.sta_connected?'Connected':'Disconnected')+'</span></p>'+(d.sta_ip?'<p>STA IP: <b>'+d.sta_ip+'</b></p>':'')+'<p>AP IP: <b>'+d.ap_ip+'</b></p>'}catch(e){}
}
async function wifiScan(){
  $('scan-btn').textContent='Scanning...';$('scan-btn').disabled=1;
  try{var r=await api('/wifi/scan');if(r.status!=='ok'){$('scan-list').innerHTML='<p style="color:var(--red)">Failed</p>';return}
    if(!r.data.length){$('scan-list').innerHTML='<p style="color:var(--dim)">No networks</p>';return}
    r.data.sort(function(a,b){return b.rssi-a.rssi});
    var h='<div class="scan-grid"><span class="scan-hdr">SSID</span><span class="scan-hdr">RSSI</span><span class="scan-hdr">Ch</span>';
    for(var i=0;i<r.data.length;i++){var a=r.data[i];var l=a.authmode>0;h+='<div class="scan-row" data-ssid="'+esc(a.ssid)+'" data-locked="'+(l?1:0)+'"><span>'+(l?'[LOCK] ':'[OPEN] ')+esc(a.ssid||'<i>hidden</i>')+'</span><span class="rssi">'+a.rssi+'dBm</span><span>'+a.channel+'</span></div>'}
    $('scan-list').innerHTML=h+'</div>'
  }catch(e){$('scan-list').innerHTML='<p style="color:var(--red)">Error</p>'}
  finally{$('scan-btn').textContent='Scan';$('scan-btn').disabled=0}
}
async function wifiConn(ssid,l){if(!l){await api('/wifi/connect',{method:'POST',body:JSON.stringify({ssid:ssid,password:''})});wifiStatus();return}var p=prompt('Password for '+ssid+':');if(p===null)return;var r=await api('/wifi/connect',{method:'POST',body:JSON.stringify({ssid:ssid,password:p})});r.status==='ok'?(alert('Connecting...'),setTimeout(wifiStatus,5000)):alert(r.error.message)}

/* Event delegation */
document.body.addEventListener('click',function(e){
  var row=e.target.closest('.scan-row');
  if(row){wifiConn(row.dataset.ssid,row.dataset.locked==='1');return}
  var btn=e.target.closest('.cur-edit-btn');
  if(btn){curEdit(+btn.dataset.id,btn.dataset.name,JSON.parse(btn.dataset.points));return}
});

/* Init */
function refreshAll(){fanRefresh();srcRefresh();curRefresh();schedRefresh();wifiStatus()}
setInterval(refreshAll,5000);refreshAll();
</script>
