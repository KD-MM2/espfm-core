syntax = "proto3";

// ESPFanManager v3 — CoAP + Protobuf protocol schema
// Generate with: nanopb_generator.py espfm.proto -D ../components/f_coap/include/

// ===== Enums =====

enum FanMode {
    FAN_MODE_MANUAL = 0;
    FAN_MODE_AUTO   = 1;
}

enum SourceType {
    SOURCE_TYPE_NTC     = 0;
    SOURCE_TYPE_DS18B20 = 1;
    SOURCE_TYPE_MANUAL  = 2;
}

enum SourceStatus {
    SOURCE_STATUS_VALID   = 0;
    SOURCE_STATUS_STALE   = 1;
    SOURCE_STATUS_INVALID = 2;
}

enum FanAlarm {
    FAN_ALARM_NONE     = 0;
    FAN_ALARM_STALL    = 1;
    FAN_ALARM_OVERTEMP = 2;
}

// ===== Core Data Types =====

message FanInfo {
    uint32 id          = 1;
    string name        = 2;   // max 15 chars
    FanMode mode       = 3;
    uint32 duty        = 4;   // 0-100%
    uint32 rpm         = 5;
    bool enabled       = 6;
    bool inverted      = 7;
    uint32 pwm_gpio    = 8;
    uint32 tach_gpio   = 9;   // 255=none
    uint32 source_id   = 10;  // 255=none
    uint32 curve_id    = 11;  // 255=none
    uint32 schedule_id = 12;  // 255=none
    uint32 group_id    = 13;
    FanAlarm alarm     = 14;
}

message SourceInfo {
    uint32 id            = 1;
    string name          = 2;
    SourceType type      = 3;
    SourceStatus status  = 4;
    float temp_c         = 5;
    uint32 gpio          = 6;  // 255=none
    uint64 ds18b20_rom_code = 7;
}

message CurvePoint {
    float temp_c  = 1;
    uint32 duty   = 2;  // 0-100%
}

message CurveInfo {
    uint32 id                   = 1;
    string name                 = 2;
    repeated CurvePoint points  = 3;  // 2-10 points
}

message ScheduleInfo {
    uint32 id         = 1;
    uint32 fan_id     = 2;
    uint32 duty       = 3;   // 0-100%
    uint32 start_min  = 4;   // 0-1439 minutes since midnight
    uint32 end_min    = 5;
    bool enabled      = 6;
    string name       = 7;   // optional display name
}

message WifiApRecord {
    string ssid     = 1;
    int32 rssi      = 2;
    uint32 channel  = 3;
    uint32 authmode = 4;
}

message SystemInfo {
    string version        = 1;
    uint32 uptime_s       = 2;
    uint32 heap_free      = 3;
    uint32 fan_count      = 4;
    uint32 source_count   = 5;
    uint32 curve_count    = 6;
    uint32 schedule_count = 7;
    string hostname       = 8;  // mDNS hostname (without .local)
}

message WifiStatus {
    bool sta_connected = 1;
    string sta_ip      = 2;
    string ap_ip       = 3;
}

// ===== Fan CRUD =====

message FanList { repeated FanInfo fans = 1; }

message FanCreateRequest {
    uint32 pwm_gpio  = 1;
    uint32 tach_gpio = 2;  // optional, 255=none
    string name      = 3;
}

message FanUpdateRequest {
    uint32 id                 = 1;  // required
    optional FanMode mode       = 2;
    optional uint32 duty        = 3;
    optional uint32 source_id   = 4;
    optional uint32 curve_id    = 5;
    optional uint32 schedule_id = 6;
    optional uint32 group_id    = 7;
    optional bool inverted      = 8;
    optional bool enabled       = 9;
    optional uint32 pwm_gpio    = 10;  // NEW
    optional uint32 tach_gpio   = 11;  // NEW (255=none)
    optional string name        = 12;  // rename fan
}

message FanId { uint32 id = 1; }

// ===== Source CRUD =====

message SourceList { repeated SourceInfo sources = 1; }

message SourceCreateRequest {
    SourceType type = 1;
    string name     = 2;
    uint32 gpio     = 3;  // optional, 255=none
    uint64 ds18b20_rom_code = 4;
}

message SourceUpdateRequest {
    uint32 id   = 1;
    string name = 2;
}

message ManualTempRequest {
    uint32 id   = 1;
    float temp_c = 2;
}

message Ds18b20Device {
    uint32 index    = 1;
    uint64 rom_code = 2;
    float temp_c    = 3;
}

message Ds18b20ScanResponse {
    repeated Ds18b20Device devices = 1;
    uint32 device_count = 2;
}

message Ds18b20ConfigRequest {
    uint32 gpio = 1;
}

// ===== Curve CRUD =====

message CurveList { repeated CurveInfo curves = 1; }

message CurveCreateRequest {
    string name                 = 1;
    repeated CurvePoint points  = 2;
}

message CurveUpdateRequest {
    uint32 id                   = 1;
    string name                 = 2;
    repeated CurvePoint points  = 3;
}

// ===== Schedule CRUD =====

message ScheduleList { repeated ScheduleInfo schedules = 1; }

message ScheduleCreateRequest {
    uint32 fan_id    = 1;
    uint32 duty      = 2;
    uint32 start_min = 3;
    uint32 end_min   = 4;
    bool enabled     = 5;
    string name      = 6;    // optional display name
}

message ScheduleUpdateRequest {
    uint32 id        = 1;
    optional uint32 fan_id    = 2;
    optional uint32 duty      = 3;
    optional uint32 start_min = 4;
    optional uint32 end_min   = 5;
    optional bool enabled     = 6;
    optional string name      = 7;    // rename schedule
}

// ===== WiFi =====

message WifiScanResult { repeated WifiApRecord aps = 1; }

message WifiConnectRequest {
    string ssid     = 1;
    string password = 2;
}

message HostnameRequest {
    string hostname = 1;  // new hostname to set
}

// ===== Persistence =====

message ConfigFile {
    string version            = 1;  // "3.0"
    FanList fans              = 2;
    SourceList sources        = 3;
    CurveList curves          = 4;
    ScheduleList schedules    = 5;
}

// ===== Generic Responses =====

message Empty {}

message StatusResponse {
    bool ok            = 1;
    uint32 error_code  = 2;  // 0 on success
    string error_msg   = 3;  // empty on success
}
